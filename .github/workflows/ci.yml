name: ci

# 三件事：数据门禁（纯 Python，秒级）、构建、真浏览器回归。
# 数据门禁放在最前面——它最快，也最常被破坏（补词、改语料都可能把它踩掉）。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data:
    name: 数据门禁 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install websocket-client
      - name: 数据门禁
        run: python tests/audit_data.py
      - name: 构建
        run: python run.py --no-open
      # 不校验"构建产物是否与仓库一致"：首页带着生成时间戳，
      # 每次构建都会不同，这项检查必然失败，没有意义。

  browser:
    name: 真浏览器回归
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install websocket-client
      - name: 构建
        run: python run.py --no-open
      - name: 主回归 + 边界回归
        env:
          CET4_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          echo "使用 Chrome: $CET4_CHROME"
          python tests/test_all.py
          python tests/test_edge.py
